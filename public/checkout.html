<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart &amp; Checkout | SHRI RAM INDIAN STORE</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <div class="page-title"><h1>Your cart</h1></div>
    <div id="emptyCart" class="box" hidden style="margin:20px 0 40px;text-align:center">
      <p>Your cart is empty.</p><br><a class="btn navy" href="shop.html">Continue shopping</a>
    </div>
    <div class="co" id="co">
      <div class="box"><h2>Items</h2><div id="items"></div></div>
      <div>
        <div class="box" style="margin-bottom:16px">
          <h2>Order summary</h2>
          <div id="summary"></div>
        </div>
        <form class="box" id="orderForm" novalidate>
          <h2>Delivery details</h2>
          <div class="field"><label for="name">Full name *</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="phone">Mobile number *</label><input id="phone" name="phone" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10-digit number" required></div>
          <div class="field"><label for="address">Full address *</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea></div>
          <div class="field"><label for="city">City / State *</label><input id="city" name="city" autocomplete="address-level2" required></div>
          <div class="field"><label for="pincode">PIN code *</label><input id="pincode" name="pincode" inputmode="numeric" maxlength="6" autocomplete="postal-code" required></div>
          <h2 style="margin-top:18px">Payment method</h2>
          <div class="pay-opts" id="payOpts"></div>
          <div class="pay-detail" id="payDetail" aria-live="polite"></div>
          <div class="field"><label for="notes">Order note (optional)</label><input id="notes" name="notes"></div>
          <div class="form-error" id="formError" role="alert"></div>
          <button class="btn wa" type="submit" style="width:100%">Place order on WhatsApp</button>
          <p class="hint">Your order details open in WhatsApp. We confirm the order, and the payment details if needed, over WhatsApp. We never ask for card numbers, PINs or OTPs.</p>
        </form>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
