<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart &amp; Checkout | SHRI RAM INDIAN STORE</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <div class="page-title"><h1>Aapka Cart</h1></div>
    <div id="emptyCart" class="box" hidden style="margin:20px 0 40px;text-align:center">
      <p>Cart khaali hai.</p><br><a class="btn maroon" href="shop.html">Shopping karein</a>
    </div>
    <div class="co" id="co">
      <div class="box"><h2>Items</h2><div id="items"></div></div>
      <div>
        <div class="box" style="margin-bottom:16px">
          <h2>Order summary</h2>
          <div id="summary"></div>
        </div>
        <form class="box" id="orderForm" novalidate>
          <h2>Delivery details</h2>
          <div class="field"><label for="name">Poora naam *</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="phone">Mobile number *</label><input id="phone" name="phone" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10 digit number" required></div>
          <div class="field"><label for="address">Poora address *</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea></div>
          <div class="field"><label for="city">Sheher / Rajya *</label><input id="city" name="city" autocomplete="address-level2" required></div>
          <div class="field"><label for="pincode">Pincode *</label><input id="pincode" name="pincode" inputmode="numeric" maxlength="6" autocomplete="postal-code" required></div>
          <div class="field"><label for="payment">Payment tareeka</label><select id="payment" name="payment"></select></div>
          <div class="field"><label for="notes">Koi note (optional)</label><input id="notes" name="notes"></div>
          <div class="form-error" id="formError" role="alert"></div>
          <button class="btn wa" type="submit" style="width:100%">💬 WhatsApp par order bhejein</button>
          <p class="hint">Order ki detail WhatsApp par hamare paas aayegi aur hum aapko confirm karenge.</p>
        </form>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
