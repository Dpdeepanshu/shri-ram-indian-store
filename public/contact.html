<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | SHRI RAM INDIAN STORE</title>
  <meta name="description" content="Contact SHRI RAM INDIAN STORE by phone, WhatsApp or email.">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <div class="page-title"><h1>Contact us</h1></div>
    <div class="contact-grid" style="margin:20px 0 40px">
      <div class="box">
        <h2>Our details</h2>
        <table class="kv">
          <tr><td>Address</td><td><span data-cfg="address"></span></td></tr>
          <tr><td>Phone / WhatsApp</td><td><a data-cfg="phoneDisplay" data-link="tel" href="#"></a></td></tr>
          <tr><td>Email</td><td><a data-cfg="email" data-link="mail" href="#"></a></td></tr>
          <tr><td>Hours</td><td><span data-cfg="hours"></span></td></tr>
          <tr><td>GSTIN</td><td><span data-cfg="gstin"></span></td></tr>
        </table>
        <h2 style="margin-top:14px">Grievance officer</h2>
        <p class="hint" style="margin-top:0"><span data-cfg="legalName"></span> (Proprietor). Write to <a data-cfg="email" data-link="mail" href="#"></a>. We acknowledge complaints within 48 hours and aim to resolve them within one month.</p>
      </div>
      <form class="box" id="contactForm">
        <h2>Send us a message on WhatsApp</h2>
        <div class="field"><label for="cname">Your name</label><input id="cname" required></div>
        <div class="field"><label for="cmsg">Your message</label><textarea id="cmsg" rows="4" required></textarea></div>
        <button class="btn wa" type="submit" style="width:100%">Send on WhatsApp</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var cfg = window.STORE_CONFIG;
      var msg = "Hello, this is " + document.getElementById("cname").value.trim() + ". " + document.getElementById("cmsg").value.trim();
      window.open("https://wa.me/" + cfg.whatsappNumber + "?text=" + encodeURIComponent(msg), "_blank");
    });
  </script>
</body>
</html>
