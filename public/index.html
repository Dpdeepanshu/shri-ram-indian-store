<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHRI RAM INDIAN STORE | Clothing, Beauty, Kitchenware &amp; Fashion Jewellery</title>
  <meta name="description" content="Clothing, daily-use beauty products, kitchenwear aur fashion jewellery: sab ek hi jagah. Poore India me delivery.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="hero">
    <h1>Aapki roz ki zaroorat, ek hi dukaan me</h1>
    <p id="heroTag"></p>
    <a class="btn" href="shop.html">Shopping shuru karein</a>
    <a class="btn alt" href="contact.html">Humse baat karein</a>
  </section>

  <section class="trust">
    <div class="wrap">
      <div>🚚 <span data-cfg="freeShippingAbove" data-money></span> se upar free shipping</div>
      <div>💵 Cash on Delivery</div>
      <div>↩️ <span data-cfg="returnDays"></span> din me return/exchange</div>
      <div>💬 WhatsApp par seedha support</div>
    </div>
  </section>

  <main class="wrap">
    <section class="section">
      <h2>Categories</h2>
      <div class="tiles" id="catTiles"></div>
    </section>

    <section class="section">
      <h2>Khaas products</h2>
      <div class="grid" id="featured"></div>
      <p class="empty" id="err" hidden>Products load nahi ho paaye. Thodi der baad dobara koshish karein.</p>
      <p style="text-align:center;margin-top:20px"><a class="btn maroon" href="shop.html">Saare products dekhein</a></p>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
