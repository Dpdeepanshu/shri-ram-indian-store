<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account | SHRI RAM INDIAN STORE</title>
  <meta name="robots" content="noindex">
  <meta property="og:image" content="https://shri-ram-indian-store.pages.dev/images/logo.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <div class="page-title"><h1>My Account</h1></div>
    <div id="loading" class="box" style="margin:20px 0;text-align:center">Loading...</div>
    <div id="acct" hidden>
      <div class="admin-bar">
        <button id="tabO" class="active">Order history</button>
        <button id="tabP">Profile</button>
        <button id="out" style="margin-left:auto">Logout</button>
      </div>
      <section id="secO"><div id="oList"></div></section>
      <section id="secP" hidden>
        <form class="box" id="pf" style="max-width:480px;margin-bottom:16px" novalidate>
          <h2>Profile</h2>
          <div class="field"><label>Email (verified)</label><input id="pEmail" disabled></div>
          <div class="field"><label for="pName">Name</label><input id="pName"></div>
          <div class="field"><label for="pPhone">Mobile number</label><input id="pPhone" inputmode="numeric"></div>
          <div class="form-error" id="pErr"></div>
          <button class="btn navy" type="submit">Save</button>
        </form>
        <form class="box" id="pw" style="max-width:480px" novalidate>
          <h2>Change password</h2>
          <div class="field"><label for="oPw">Current password</label><input id="oPw" type="password" autocomplete="current-password"></div>
          <div class="field"><label for="nPw">New password (min 8 characters)</label><input id="nPw" type="password" autocomplete="new-password"></div>
          <div class="form-error" id="wErr"></div>
          <button class="btn navy" type="submit">Change password</button>
        </form>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
