<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice | SHRI RAM INDIAN STORE</title>
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:image" content="https://shri-ram-indian-store.pages.dev/images/logo.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --inv-navy: #112653; --inv-gold: #c6a040; --inv-soft: #f3f5fa; --inv-line: #d9deea; }
    body { background: #e9ebf2; }
    #waFloat { display: none !important; }

    /* ---------- screen-only controls ---------- */
    .bar { max-width: 860px; margin: 14px auto 10px; padding: 0 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .bar .hint { margin: 0; flex: 1 1 200px; }
    .panel { max-width: 860px; margin: 0 auto 12px; padding: 0 12px; }
    .panel .pin { background: #fff; border: 1px solid var(--inv-line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; }
    .panel .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .panel label { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); flex: 1 1 190px; min-width: 0; }
    .panel label.chk { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; padding-bottom: 10px; color: var(--ink); font-size: .92rem; }
    .panel label.chk input { width: auto; }
    .panel input, .panel select, .panel textarea { padding: 8px 10px; font-size: .95rem; }
    .panel textarea { resize: vertical; }
    .seg { display: flex; border: 2px solid var(--inv-navy); border-radius: 999px; overflow: hidden; flex: 1 1 320px; max-width: 420px; }
    .seg button { flex: 1; border: 0; background: #fff; color: var(--inv-navy); font: 600 .92rem var(--sans); padding: 9px 10px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--inv-navy); color: #fff; }
    .msg { font-size: .85rem; margin: 0; } .msg.bad { color: var(--red); } .msg.good { color: var(--green); }
    .sheet { max-width: 860px; margin: 0 auto 30px; padding: 0 12px; }

    /* ---------- invoice sheet ---------- */
    .inv { background: #fff; color: #111; padding: 26px 28px 20px; font: 13.5px/1.45 var(--sans); box-shadow: 0 1px 8px rgba(0,0,0,.14); border-top: 6px solid var(--inv-navy); }
    .inv small { font-size: 11px; }
    .inv .top { display: flex; gap: 16px; align-items: flex-start; }
    .inv .lg { width: 92px; height: 92px; flex: none; }
    .inv .cop { flex: 1 1 auto; min-width: 0; }
    .inv h1 { font: 700 23px/1.15 var(--serif); color: var(--inv-navy); letter-spacing: .02em; margin-bottom: 4px; }
    .inv .ad { color: #333; margin-bottom: 3px; }
    .inv .ct { display: flex; flex-wrap: wrap; gap: 2px 16px; color: #222; font-size: 12.5px; }
    .inv .ttl { flex: none; text-align: right; }
    .inv .ttl b { display: block; font: 700 22px/1.1 var(--serif); color: var(--inv-navy); letter-spacing: .06em; }
    .inv .ttl span { display: inline-block; margin-top: 6px; border: 1px solid var(--inv-gold); color: #7a5d12; background: #faf4e2; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 2px 8px; border-radius: 4px; }
    .inv .goldrule { height: 3px; background: linear-gradient(90deg, var(--inv-gold), #e6cf8a 50%, var(--inv-gold)); margin: 14px 0 12px; }
    .inv .meta { display: flex; flex-wrap: wrap; background: var(--inv-soft); border: 1px solid var(--inv-line); border-radius: 6px; }
    .inv .meta > div { padding: 5px 9px; border-right: 1px solid var(--inv-line); flex: 1 1 auto; min-width: 0; }
    .inv .meta b { font-size: 12.5px; white-space: nowrap; display: block; }
    .inv .meta > div:last-child { border-right: 0; }
    .inv .meta small { display: block; color: #667; text-transform: uppercase; letter-spacing: .05em; font-size: 10px; }
    .inv .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
    .inv .pty { border: 1px solid var(--inv-line); border-radius: 6px; padding: 10px 12px; overflow-wrap: anywhere; }
    .inv .lbl { font-weight: 700; font-size: 11px; letter-spacing: .08em; color: var(--inv-navy); border-bottom: 1px solid var(--inv-line); padding-bottom: 4px; margin-bottom: 6px; }
    .inv .pn { display: block; font-size: 14px; margin-bottom: 2px; }
    .inv .tw { overflow-x: auto; }
    .inv table.it { width: 100%; border-collapse: collapse; min-width: 600px; }
    .inv table.it th { background: var(--inv-navy); color: #fff; text-align: left; padding: 8px 7px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; white-space: nowrap; }
    .inv table.it td { padding: 8px 7px; border-bottom: 1px solid #e4e7ef; vertical-align: top; }
    .inv table.it tbody tr:nth-child(even) td { background: #fafbfd; }
    .inv table.it tfoot td { background: var(--inv-soft); border-top: 2px solid var(--inv-navy); border-bottom: 1px solid var(--inv-line); padding: 8px 7px; }
    .inv .r { text-align: right; } .inv .c { text-align: center; width: 28px; }
    .inv td small { display: block; color: #888; }
    .inv .mid { display: flex; gap: 18px; justify-content: space-between; flex-wrap: wrap; margin-top: 12px; align-items: flex-start; }
    .inv .left { flex: 1 1 300px; min-width: 0; display: grid; gap: 10px; }
    .inv .words { background: var(--inv-soft); border-left: 4px solid var(--inv-gold); padding: 7px 12px; }
    .inv .words small { display: block; color: #667; text-transform: uppercase; letter-spacing: .05em; font-size: 10px; }
    .inv .tot { flex: 0 1 290px; min-width: 240px; border: 1px solid var(--inv-line); border-radius: 6px; padding: 4px 0; }
    .inv .tot > div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 12px; }
    .inv .tot .g { background: var(--inv-navy); color: #fff; margin: 5px 0; padding: 8px 12px; font-size: 15px; }
    .inv .paybox { border: 1px dashed #9aa5c0; border-radius: 6px; padding: 8px 12px; }
    .inv .paybox.qr { display: flex; gap: 12px; align-items: center; }
    
    .inv a { color: inherit; text-decoration: none; } .inv .thanks a { color: #1a4fa0; text-decoration: underline; font-weight: 700; }
    .inv .qrcol { flex: none; text-align: center; } .inv .qrcol img { width: 104px; height: 104px; image-rendering: pixelated; border: 1px solid #ccd; padding: 2px; background: #fff; } .inv .qrcap { font-size: 10.5px; color: #444; margin-top: 2px; } .inv .paybox.retail .qrcap { display: none; }
    .inv .ph { font-weight: 700; color: var(--inv-navy); margin-bottom: 4px; }
    .inv .ph small { font-weight: 500; color: #555; }
    .inv .pn2 { font-size: 12px; color: #444; margin-top: 4px; }
    .inv .upi { margin-top: 4px; font-size: 12.5px; }
    .inv table.bk td { padding: 1px 10px 1px 0; vertical-align: top; font-size: 12.5px; } .inv table.bk td:first-child { color: #555; white-space: nowrap; }
    .inv .hsn { margin-top: 14px; } .inv .lbl2 { font-weight: 700; font-size: 11px; letter-spacing: .08em; color: var(--inv-navy); margin-bottom: 4px; }
    .inv table.it.sm { min-width: 0; } .inv table.it.sm th { font-size: 10.5px; padding: 5px 6px; } .inv table.it.sm td { padding: 4px 6px; font-size: 12px; }
    .inv .foot { display: flex; gap: 20px; justify-content: space-between; flex-wrap: wrap; margin-top: 16px; border-top: 1px solid var(--inv-line); padding-top: 12px; align-items: stretch; }
    .inv .terms { flex: 1 1 300px; font-size: 12px; color: #333; } .inv .terms div { margin-top: 3px; }
    .inv .terms b { color: var(--inv-navy); letter-spacing: .06em; font-size: 11px; }
    .inv .sign { flex: 0 0 240px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .inv .sign .for { font-size: 12.5px; }
    .inv .sign .ss { position: relative; height: 84px; }
    .inv .sign .stamp { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; transform: translate(-108%, -50%); mix-blend-mode: multiply; opacity: .92; }
    .inv .sign .sig { position: absolute; left: 50%; top: 50%; width: 128px; transform: translate(-48%, -52%); mix-blend-mode: multiply; }
    .inv .sign .line { border-top: 1px solid #333; padding-top: 4px; font-weight: 600; font-size: 12.5px; }
    .inv .sign .line small { display: block; font-weight: 400; color: #555; }
    .inv .thanks { margin-top: 14px; text-align: center; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #7a5d12; border-top: 3px double var(--inv-gold); padding-top: 8px; }

    @media (max-width: 600px) {
      .inv { padding: 16px 12px; font-size: 13px; }
      .inv .top { flex-wrap: wrap; } .inv .ttl { flex: 1 1 100%; text-align: left; }
      .inv .two { grid-template-columns: 1fr; } .inv .meta > div { flex: 1 1 45%; border-right: 0; border-bottom: 1px solid var(--inv-line); } .inv .meta b { white-space: normal; overflow-wrap: anywhere; }
      .inv .sign { flex: 1 1 100%; } .inv .paybox.qr { flex-direction: column; align-items: flex-start; }
    }
    @media print {
      @page { size: A4; margin: 8mm; }
      body { background: #fff; } .bar, .panel { display: none !important; } .sheet { padding: 0; max-width: none; margin: 0; }
      .inv { box-shadow: none; padding: 0; border-top-width: 5px; font-size: 11.5px; line-height: 1.35; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .inv .tw { overflow: visible; } .inv table.it { min-width: 0; } .inv table.it td { padding: 5px 6px; } .inv table.it th { padding: 6px; } .inv .goldrule { margin: 9px 0 8px; } .inv .two { margin: 9px 0; } .inv .mid { margin-top: 8px; } .inv .hsn { margin-top: 8px; } .inv .foot { margin-top: 10px; padding-top: 8px; } .inv .sign .ss { height: 70px; } .inv .thanks { margin-top: 8px; padding-top: 5px; } .inv .pty { padding: 7px 10px; }
      .inv .two { grid-template-columns: 1fr 1fr !important; } .inv .top { flex-wrap: nowrap !important; } .inv .ttl { flex: none !important; text-align: right !important; }
      .inv .foot, .inv .mid, .inv .pty, .inv .sign, .inv table.it tr { break-inside: avoid; }
      .inv .meta { flex-wrap: nowrap !important; } .inv .meta b { font-size: 11.5px; } .inv .meta > div { border-bottom: 0 !important; border-right: 1px solid var(--inv-line) !important; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden>
    <button class="btn navy" id="printBtn" type="button">Print / Save as PDF</button>
    <a class="btn" id="backLink" href="shop.html">Back to shop</a>
    <a class="btn" id="ordersLink" href="account.html">My orders</a>
    <p class="hint">Tip: in the print window choose "Save as PDF" to download the invoice.</p>
  </div>

  <div class="panel" id="panel" hidden>
    <div class="pin">
      <div class="row">
        <div class="seg" role="group" aria-label="Customer type">
          <button type="button" data-t="retail" aria-pressed="true">Retail customer</button>
          <button type="button" data-t="business" aria-pressed="false">Business customer (GST)</button>
        </div>
        <label>Invoice date <input type="date" id="dt"></label>
        <label class="chk"><input type="checkbox" id="sg" checked> Signature &amp; stamp</label>
      </div>
      <p class="msg" id="dtMsg"></p>
      <div id="bizF" hidden>
        <div class="row">
          <label>Business name *<input id="bn" autocomplete="organization" maxlength="100" placeholder="e.g. K. K. Beej Bhandar"></label>
          <label>GSTIN *<input id="bg" maxlength="15" autocapitalize="characters" spellcheck="false" placeholder="15-character GSTIN"></label>
        </div>
        <div class="row" style="margin-top:12px">
          <label>State (place of supply)<select id="bs"></select></label>
          <label>Mobile<input id="bp" inputmode="tel" maxlength="15"></label>
        </div>
        <div class="row" style="margin-top:12px">
          <label>Billing address<textarea id="ba" rows="2" maxlength="250"></textarea></label>
        </div>
        <p class="msg" id="bMsg" style="margin-top:8px"></p>
      </div>
    </div>
  </div>

  <div class="sheet"><div id="out"><p style="padding:30px;text-align:center">Loading invoice...</p></div></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/invoice.js"></script>
  <script>
    (async function () {
      const S = window.SRIS, I = S.invoice, q = new URLSearchParams(location.search), out = document.getElementById("out"), $ = (id) => document.getElementById(id);
      const fail = (m) => { out.innerHTML = '<p style="padding:30px;text-align:center">' + S.esc(m) + "</p>"; };
      // DB row -> invoice order (admin aur customer dono ke liye)
      const fromRow = (o) => {
        let lines = []; try { lines = JSON.parse(o.items); } catch (e) {}
        let bt = o.customer_type, bn = o.biz_name, bg = o.gstin, nt = o.notes;
        const m = /^\[B2B\] (.*?) \| ([0-9A-Z]{15})(?: \| (.*))?$/.exec(String(nt || "")); // migrate_003 se pehle ke orders
        if (!bg && m) { bt = "business"; bn = m[1]; bg = m[2]; nt = m[3] || ""; }
        return { customerType: bt === "business" ? "business" : "retail", biz: bt === "business" ? { name: bn, gstin: bg } : null, no: o.order_no, invoiceNo: o.invoice_no, ts: Date.parse(String(o.created_at).replace(" ", "T") + "Z"), name: o.name, phone: o.phone, address: o.address, city: o.city, state: o.state, pincode: o.pincode, payment: o.payment, notes: nt, shipping: o.shipping, lines };
      };
      let order = null;
      try {
        if (q.get("id")) { // admin panel se
          let token = ""; try { token = sessionStorage.getItem("sris_admin") || ""; } catch (e) {}
          if (!token) return fail("Please open this invoice from the Admin panel (Orders tab).");
          const r = await fetch("/api/admin/orders?id=" + encodeURIComponent(q.get("id")), { headers: { "x-admin-token": token } });
          if (!r.ok) return fail("Could not load this order (error " + r.status + ").");
          order = fromRow(await r.json());
          $("backLink").hidden = true;
        } else { // customer: pehle server (login ke saath), warna is device me saved aakhri order
          const no = q.get("no");
          if (no && S.cfg.useDatabase) {
            try {
              const r = await fetch("/api/my/orders?no=" + encodeURIComponent(no), { credentials: "same-origin" });
              if (r.ok) order = fromRow(await r.json());
              else if (r.status === 401) return fail("Please log in to see this invoice. Go to Login, then open My Account > Order history.");
            } catch (e) {}
          }
          if (!order) {
            let o = null; try { o = JSON.parse(localStorage.getItem("sris_last_order_v1")); } catch (e) {}
            if (!o || (no && o.no !== no)) return fail("Invoice not found. Please open it from My Account > Order history, or contact us on WhatsApp with your order number.");
            order = o;
          }
        }
      } catch (e) { return fail("Could not load the invoice. Please try again."); }

      // ---------- options (customer type, date, business details) ----------
      const KEY = "sris_inv_opts_v1_" + (order.invoiceNo || order.no);
      const fullAddr = [order.address, order.city, order.state, order.pincode].filter(Boolean).join(", ");
      const opts = { type: "retail", date: I.clampDate(I.ymdIST(order.ts)), sign: true, biz: { name: "", gstin: "", address: fullAddr, state: order.state || "", phone: order.phone || "" } };
      if (order.customerType === "business" && order.biz) { // checkout me business chuna tha
        opts.type = "business"; opts.biz.name = order.biz.name || ""; opts.biz.gstin = order.biz.gstin || "";
        opts.biz.state = I.GST_STATES[String(opts.biz.gstin).slice(0, 2)] || opts.biz.state;
      }
      try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") { Object.assign(opts, s, { biz: Object.assign(opts.biz, s.biz || {}) }); opts.date = I.clampDate(opts.date); } } catch (e) {}
      const save = () => { try { localStorage.setItem(KEY, JSON.stringify(opts)); } catch (e) {} };

      const rg = I.dateRange();
      $("dt").min = rg.min; $("dt").max = rg.max;
      $("bs").innerHTML = '<option value="">Select state</option>' + S.STATES.map((x) => "<option>" + S.esc(x) + "</option>").join("");

      function bizStatus() {
        const b = opts.biz, g = String(b.gstin || "").toUpperCase();
        if (!b.name.trim()) return { ok: false, text: "Enter the business name.", cls: "bad" };
        if (!g) return { ok: false, text: "Enter the customer's 15-character GSTIN.", cls: "bad" };
        if (!I.gstinValid(g)) return { ok: false, text: "This GSTIN looks invalid. Please check it (format or check digit).", cls: "bad" };
        if (!b.state) return { ok: false, text: "Select the state.", cls: "bad" };
        const intra = b.state.toLowerCase() === S.cfg.sellerState.toLowerCase();
        return { ok: true, text: "GSTIN valid. " + (intra ? "Same state: CGST + SGST will be charged." : "Other state: IGST will be charged."), cls: "good" };
      }

      function sync() { // controls -> screen
        document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === opts.type)));
        $("bizF").hidden = opts.type !== "business";
        $("dt").value = opts.date; $("sg").checked = !!opts.sign;
        $("dtMsg").textContent = "You can pick any date from " + rg.min.split("-").reverse().join("/") + " up to today. The invoice date should match the actual date of supply.";
        $("dtMsg").className = "msg";
      }

      function render() {
        let o = opts, ok = true;
        if (opts.type === "business") {
          const st = bizStatus(); ok = st.ok;
          $("bMsg").textContent = st.text; $("bMsg").className = "msg " + st.cls;
          o = Object.assign({}, opts, { biz: Object.assign({}, opts.biz, { name: opts.biz.name.trim() || "(Business name)", gstin: String(opts.biz.gstin || "").toUpperCase() }) });
        }
        out.innerHTML = I.build(order, o);
        $("printBtn").disabled = !ok;
        $("printBtn").title = ok ? "" : "Complete the business details first";
        save();
      }

      document.querySelector(".seg").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-t]"); if (!b) return;
        opts.type = b.dataset.t; sync(); render();
      });
      $("dt").addEventListener("change", () => { opts.date = I.clampDate($("dt").value); $("dt").value = opts.date; render(); });
      $("sg").addEventListener("change", () => { opts.sign = $("sg").checked; render(); });
      $("bn").addEventListener("input", () => { opts.biz.name = $("bn").value; render(); });
      $("bg").addEventListener("input", () => {
        const g = $("bg").value.toUpperCase().replace(/[^0-9A-Z]/g, "").slice(0, 15);
        if (g !== $("bg").value) $("bg").value = g;
        opts.biz.gstin = g;
        if (g.length >= 2 && I.GST_STATES[g.slice(0, 2)]) { opts.biz.state = I.GST_STATES[g.slice(0, 2)]; $("bs").value = opts.biz.state; }
        render();
      });
      $("bs").addEventListener("change", () => { opts.biz.state = $("bs").value; render(); });
      $("bp").addEventListener("input", () => { opts.biz.phone = $("bp").value; render(); });
      $("ba").addEventListener("input", () => { opts.biz.address = $("ba").value; render(); });
      $("printBtn").addEventListener("click", () => window.print());

      $("bn").value = opts.biz.name; $("bg").value = opts.biz.gstin; $("bs").value = opts.biz.state; $("bp").value = opts.biz.phone; $("ba").value = opts.biz.address;
      sync(); render();
      document.title = "Invoice " + (order.invoiceNo || order.no) + " | " + S.cfg.storeName;
      $("bar").hidden = false; $("panel").hidden = false;
    })();
  </script>
</body>
</html>
