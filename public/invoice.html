<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice | SHRI RAM INDIAN STORE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #e9ebf2; }
    #waFloat { display: none !important; }
    .bar { max-width: 820px; margin: 14px auto; padding: 0 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .bar .hint { margin: 0; flex: 1 1 200px; }
    .sheet { max-width: 820px; margin: 0 auto 30px; padding: 0 12px; }
    .inv { background: #fff; color: #111; padding: 26px 28px; font: 14px/1.45 var(--sans); box-shadow: 0 1px 6px rgba(0,0,0,.12); overflow-x: auto; }
    .inv .itag { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .inv .itag span { border: 1px solid #aaa; color: #777; font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .inv .head { display: flex; gap: 20px; align-items: flex-start; }
    .inv .head img { width: 110px; height: 110px; object-fit: contain; flex: none; }
    .inv h1 { font-size: 28px; line-height: 1.15; margin-bottom: 6px; color: #000; }
    .inv .rule { height: 9px; background: #000; margin: 14px 0 0; }
    .inv .band { background: #e4e4e4; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 18px; }
    .inv .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 16px 0; }
    .inv .lbl { font-weight: 600; letter-spacing: .02em; margin-bottom: 8px; }
    .inv .pn { display: block; margin-bottom: 2px; }
    .inv table.it { width: 100%; border-collapse: collapse; margin-top: 6px; border-top: 2px solid #000; }
    .inv table.it th { text-align: left; padding: 12px 6px; border-bottom: 2px solid #000; font-weight: 600; }
    .inv table.it td { padding: 12px 6px; border-bottom: 1px solid #e3e3e3; vertical-align: top; }
    .inv .r { text-align: right; } .inv td small { display: block; color: #888; font-size: 11px; }
    .inv .sub { display: grid; grid-template-columns: 1fr 60px 130px 130px; border-top: 3px solid #000; border-bottom: 2px solid #000; margin-top: 70px; padding: 10px 6px; text-align: right; }
    .inv .sub b:first-child { text-align: left; }
    .inv .foot { display: flex; gap: 24px; justify-content: space-between; flex-wrap: wrap; padding: 14px 6px; }
    .inv .terms { flex: 1 1 280px; font-size: 13px; } .inv .terms div { margin-top: 4px; }
    .inv .tot { flex: 0 1 300px; min-width: 240px; }
    .inv .tot > div { display: flex; justify-content: space-between; padding: 3px 8px; }
    .inv .tot .g { border-top: 1px solid #333; border-bottom: 1px solid #333; margin: 6px 0; padding: 6px 8px; }
    .inv .words { text-align: right; padding: 8px 6px; }
    @media (max-width: 560px) { .inv { padding: 16px 12px; font-size: 13px; } .inv .head { flex-direction: column; } .inv .two { grid-template-columns: 1fr; gap: 10px; } .inv .sub { grid-template-columns: 1fr 40px 90px 90px; margin-top: 30px; } }
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; } .bar { display: none !important; } .sheet { padding: 0; max-width: none; margin: 0; }
      .inv { box-shadow: none; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden>
    <button class="btn navy" id="printBtn" type="button">Print / Save as PDF</button>
    <a class="btn" id="backLink" href="shop.html">Back to shop</a>
    <p class="hint">Tip: in the print window choose "Save as PDF" to download the invoice.</p>
  </div>
  <div class="sheet"><div id="out"><p style="padding:30px;text-align:center">Loading invoice...</p></div></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/invoice.js"></script>
  <script>
    (async function () {
      const S = window.SRIS, q = new URLSearchParams(location.search), out = document.getElementById("out");
      const fail = (m) => { out.innerHTML = '<p style="padding:30px;text-align:center">' + S.esc(m) + "</p>"; };
      let order = null;
      try {
        if (q.get("id")) { // admin panel se
          let token = ""; try { token = sessionStorage.getItem("sris_admin") || ""; } catch (e) {}
          if (!token) return fail("Please open this invoice from the Admin panel (Orders tab).");
          const r = await fetch("/api/admin/orders?id=" + encodeURIComponent(q.get("id")), { headers: { "x-admin-token": token } });
          if (!r.ok) return fail("Could not load this order (error " + r.status + ").");
          const o = await r.json();
          let lines = []; try { lines = JSON.parse(o.items); } catch (e) {}
          order = { no: o.order_no, invoiceNo: o.invoice_no, ts: Date.parse(String(o.created_at).replace(" ", "T") + "Z"), name: o.name, phone: o.phone, address: o.address, city: o.city, state: o.state, pincode: o.pincode, payment: o.payment, notes: o.notes, shipping: o.shipping, lines };
          document.getElementById("backLink").hidden = true;
        } else { // customer: last order is device me saved hai
          let o = null; try { o = JSON.parse(localStorage.getItem("sris_last_order_v1")); } catch (e) {}
          if (!o || (q.get("no") && o.no !== q.get("no"))) return fail("Invoice not found on this device. Please contact us on WhatsApp with your order number and we will send it.");
          order = o;
        }
        out.innerHTML = S.invoice.build(order);
        document.title = "Invoice " + (order.invoiceNo || order.no) + " | " + S.cfg.storeName;
        document.getElementById("bar").hidden = false;
        document.getElementById("printBtn").addEventListener("click", () => window.print());
      } catch (e) { fail("Could not load the invoice. Please try again."); }
    })();
  </script>
</body>
</html>
