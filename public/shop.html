<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | SHRI RAM INDIAN STORE</title>
  <meta name="description" content="Clothing, beauty, kitchenwear aur fashion jewellery ke saare products.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <div class="page-title"><h1>Shop</h1></div>
    <div class="controls">
      <input id="q" type="search" placeholder="Product khojein...">
      <select id="cat"></select>
      <select id="sort">
        <option value="new">Naye pehle</option>
        <option value="low">Price: kam se zyada</option>
        <option value="high">Price: zyada se kam</option>
      </select>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Koi product nahi mila.</p>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
