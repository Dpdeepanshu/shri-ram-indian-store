<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | SHRI RAM INDIAN STORE</title>
  <meta name="description" content="Browse hair care, skincare, makeup and men's leather wallets.">
  <meta property="og:image" content="https://shri-ram-indian-store.pages.dev/images/logo.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Shop</div>
    <div class="page-title"><h1>Shop</h1></div>
    <div class="controls">
      <input id="q" type="search" placeholder="Search by name, brand or description" aria-label="Search products">
      <select id="cat" aria-label="Category"></select>
      <select id="sort" aria-label="Sort by">
        <option value="new">Best match / newest</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No products found. Try a different search or category.</p>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
