<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | SHRI RAM INDIAN STORE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <div class="page-title"><h1>Admin Panel</h1></div>

    <form class="box" id="loginBox" style="max-width:420px;margin:20px 0">
      <h2>Login</h2>
      <div class="field"><label for="token">Admin password (ADMIN_TOKEN)</label><input id="token" type="password" autocomplete="current-password"></div>
      <div class="form-error" id="loginErr"></div>
      <button class="btn navy" type="submit">Login</button>
      <p class="hint">This panel works only after the database is set up (SETUP.md, steps 9 and 10).</p>
    </form>

    <div id="panel" hidden>
      <div class="admin-bar">
        <button id="tabP" class="active">Products</button>
        <button id="tabO">Orders</button>
        <button id="logout" style="margin-left:auto">Logout</button>
      </div>

      <section id="secP">
        <form class="box" id="pForm" style="margin-bottom:16px">
          <h2 id="pFormTitle">Add new product</h2>
          <input type="hidden" id="pId">
          <div class="form-grid">
            <div class="field full"><label>Name *</label><input id="pName" required></div>
            <div class="field"><label>Category *</label><select id="pCat"></select></div>
            <div class="field"><label>Price (₹) *</label><input id="pPrice" type="number" min="1" required></div>
            <div class="field"><label>MRP / original price (₹, optional)</label><input id="pMrp" type="number" min="0"></div>
            <div class="field"><label>Image link or /images/photo.jpg</label><input id="pImage"></div>
            <div class="field full"><label>Description</label><textarea id="pDesc" rows="3"></textarea></div>
            <div class="field full checks">
              <label><input type="checkbox" id="pStock" checked> In stock</label>
              <label><input type="checkbox" id="pFeat"> Show on home page</label>
              <label><input type="checkbox" id="pActive" checked> Show on site</label>
            </div>
          </div>
          <div class="form-error" id="pErr"></div>
          <button class="btn navy" type="submit" id="pSave">Save</button>
          <button class="btn" type="button" id="pCancel" hidden>Cancel edit</button>
        </form>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody id="pRows"></tbody></table></div>
      </section>

      <section id="secO" hidden>
        <div id="oList"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
